name: Deploy unkernelOS to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 24 (for unkernel JSPI image verification)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Fetch base unkernel distro images (Alpine + Debian)
        run: bun run fetch-distros

      - name: Cache pre-installed Debian Dev + AI + Science + Rust + OCaml + microML EROFS image
        id: cache-debian-dev
        uses: actions/cache@v4
        with:
          path: .cache/custom-distros/debian-full.erofs
          key: debian-full-v3-${{ hashFiles('scripts/build-debian-dev.sh', 'scripts/guest/install-microml.sh', 'bun.lock') }}

      - name: Build full pre-installed Debian EROFS (git, gh, python, science, rust, ocaml, microML, sqlite3, node, bun, pi, claude, mesa/gl, foot)
        if: steps.cache-debian-dev.outputs.cache-hit != 'true'
        run: |
          BASE_DEBIAN=$(find .cache/distros -name "debian.erofs" | head -n1)
          chmod +x scripts/build-debian-dev.sh
          mkdir -p .cache/custom-distros
          ./scripts/build-debian-dev.sh "$BASE_DEBIAN" .cache/custom-distros/debian-full.erofs

      - name: Verify pre-installed Debian image boots & runs all tools in unkernel.wasm
        run: node scripts/verify-debian-image.ts .cache/custom-distros/debian-full.erofs

      - name: Build static bundle for GitHub Pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Bundle distro images into dist/distros
        run: |
          mkdir -p dist/distros
          find .cache/distros -name "alpine.erofs" -exec cp {} dist/distros/alpine.erofs \;
          cp .cache/custom-distros/debian-full.erofs dist/distros/debian.erofs
          ls -lh dist/distros/ dist/assets/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
